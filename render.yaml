# Render deployment blueprint - single web service.
# Express serves the built React SPA and the /api routes from one process on one
# domain, so the frontend keeps using relative /api requests and needs no CORS.
#
# Dashboard: New + -> Blueprint -> connect this repository.
# JWT_SECRET and ADMIN_PASSWORD are marked sync:false, so Render asks you to
# enter them once in the dashboard and never stores the values in this file.
#
# If you configure the service by hand instead of using this blueprint, these are
# the values it stands for:
#   Runtime          Node
#   Root Directory   (leave empty - the repository root)
#   Build Command    npm ci --include=dev && npm run build
#   Start Command    npm start
#   Publish Directory  not used: this service serves dist/ itself
#   Health Check Path  /api/health
services:
  - type: web
    name: visitor-registration
    runtime: node
    plan: free
    region: singapore
    branch: main
    # Root Directory stays the repository root because this one process serves
    # both the SPA and /api.
    #
    # --include=dev is required: Render sets NODE_ENV=production, which makes npm
    # skip devDependencies - and vite, @vitejs/plugin-react, tailwindcss and
    # autoprefixer live there. Without the flag the build fails with
    # "sh: 1: vite: not found".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_NAME
        value: Admin User
      - key: JWT_EXPIRES_IN
        value: 8h
      # Secrets: set the values in the Render dashboard after the first deploy.
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Only needed if the frontend is ever hosted on a different origin.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
