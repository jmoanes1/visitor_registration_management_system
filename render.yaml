services:
  - type: web
    name: visitor-registration
    runtime: node
    plan: free
    region: singapore
    branch: main
    # NODE_ENV=production makes npm ci omit devDependencies; vite is required to build the SPA.
    buildCommand: npm ci --include=dev --prefix backend && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
