# Render deployment blueprint - single web service.
# Express serves the built React SPA and the /api routes from one process on one
# domain, so the frontend keeps using relative /api requests and needs no CORS.
#
# Dashboard: New + -> Blueprint -> connect this repository.
# JWT_SECRET and ADMIN_PASSWORD are marked sync:false, so Render asks you to
# enter them once in the dashboard and never stores the values in this file.
services:
  - type: web
    name: visitor-registration
    runtime: node
    plan: free
    region: singapore
    branch: main
    # NODE_ENV=production makes npm omit devDependencies, but vite is one of them.
    buildCommand: npm ci --include=dev --prefix backend && npm ci --include=dev --prefix frontend && npm run build --prefix frontend
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ADMIN_EMAIL
        value: admin@visitorreg.com
      - key: ADMIN_NAME
        value: Admin User
      - key: JWT_EXPIRES_IN
        value: 8h
      # Secrets: set the values in the Render dashboard after the first deploy.
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Only needed if the frontend is ever hosted on a different origin.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
